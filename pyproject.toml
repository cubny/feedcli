[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedcli"
version = "0.3.0"
description = "Local Python library + CLI for RSS/Atom/JSON-Feed management"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "click>=8.0",
    "sqlalchemy>=2.0",
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "respx>=0.20",
]

[project.scripts]
feedcli = "feedcli.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
